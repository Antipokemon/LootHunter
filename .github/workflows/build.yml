name: Build LootHunter

on:
  push:
    branches:
      - main
      - "dev/**"
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download Dalamud
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://goatcorp.github.io/dalamud-distrib/latest.zip" `
            -OutFile "dalamud-latest.zip"

          $dalamudPath = "$env:AppData\XIVLauncher\addon\Hooks\dev"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $dalamudPath | Out-Null

          Expand-Archive `
            -Force `
            -Path "dalamud-latest.zip" `
            -DestinationPath $dalamudPath

      - name: Restore dependencies
        run: dotnet restore LootHunter.csproj

      - name: Build LootHunter
        run: >
          dotnet build
          LootHunter.csproj
          --configuration Release
          --no-restore

      - name: Validate repo.json
        shell: pwsh
        run: |
          $repo = Get-Content "./repo.json" -Raw | ConvertFrom-Json

          if ($repo.Count -ne 1) {
              throw "repo.json must contain exactly one LootHunter manifest."
          }

          $plugin = $repo[0]

          if ($plugin.InternalName -ne "LootHunter") {
              throw "repo.json InternalName is not LootHunter."
          }

          if ($plugin.DalamudApiLevel -ne 15) {
              throw "repo.json DalamudApiLevel must be 15."
          }

          if (-not $plugin.DownloadLinkInstall.EndsWith("/LootHunter.zip")) {
              throw "DownloadLinkInstall must point to LootHunter.zip."
          }

          Write-Host "repo.json validation passed."

      - name: Validate build output
        shell: pwsh
        run: |
          $release = ".\bin\Release"
          $package = ".\bin\Release\LootHunter\latest.zip"

          if (-not (Test-Path "$release\LootHunter.dll")) {
              throw "LootHunter.dll was not produced at $release\LootHunter.dll"
          }

          if (-not (Test-Path "$release\LootHunter.json")) {
              throw "LootHunter.json was not produced at $release\LootHunter.json"
          }

          if (-not (Test-Path $package)) {
              Write-Host "Contents of bin\Release:"
              Get-ChildItem -Recurse $release -ErrorAction SilentlyContinue
              throw "Dalamud SDK package was not produced at $package"
          }

          Write-Host "Build output:"
          Get-ChildItem $release

          Write-Host "Dalamud package:"
          Get-Item $package

      - name: Validate Dalamud package contents
        shell: pwsh
        run: |
          $package = ".\bin\Release\LootHunter\latest.zip"
          $testPath = ".\package-test"

          if (Test-Path $testPath) {
              Remove-Item -Recurse -Force $testPath
          }

          Expand-Archive `
            -Path $package `
            -DestinationPath $testPath

          if (-not (Test-Path "$testPath\LootHunter.dll")) {
              Write-Host "Package contents:"
              Get-ChildItem -Recurse $testPath
              throw "LootHunter.dll is missing from the Dalamud package."
          }

          if (-not (Test-Path "$testPath\LootHunter.json")) {
              Write-Host "Package contents:"
              Get-ChildItem -Recurse $testPath
              throw "LootHunter.json is missing from the Dalamud package."
          }

          Write-Host "Package validation passed."
          Get-ChildItem $testPath

      - name: Prepare development package
        shell: pwsh
        run: |
          Copy-Item `
            ".\bin\Release\LootHunter\latest.zip" `
            ".\LootHunter.zip" `
            -Force

      - name: Upload plugin package
        uses: actions/upload-artifact@v4
        with:
          name: LootHunter-${{ github.sha }}
          path: LootHunter.zip
          if-no-files-found: error
          retention-days: 14
